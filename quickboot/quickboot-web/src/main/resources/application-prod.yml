# 生产：MySQL。敏感连接信息建议使用 jasypt ENC(...) 或容器环境变量注入。
# 启动示例：java -Djasypt.encryptor.password=你的密钥 -jar app.jar --spring.profiles.active=prod
# 覆盖 application.yml：启用 Redis 与 Sa-Token Redis DAO（需配置 spring.data.redis.host 等）
spring:
  autoconfigure:
    exclude:
      - cloud.tianai.captcha.spring.autoconfiguration.CacheStoreAutoConfiguration
  datasource:
    url: jdbc:mysql://192.168.50.105:3406/qc2?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8&allowMultiQueries=true&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false
    username: root
    password: rootroot
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
      filter:
        stat:
          log-slow-sql: true
          slow-sql-millis: 3000
        wall:
          enabled: true
          config:
            # Flyway 执行 DDL；允许多语句。索引勿写 IF NOT EXISTS（Wall 解析会报 token IF）
            multi-statement-allow: true
            ddl-allow: true
            # 积木报表 / JimuBI 动态 SQL（where 1=1）
            select-where-alway-true-check: false
            condition-and-alway-true-allow: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

qc:
  security:
    firewall:
      # 生产须配置实际访问域名/IP:端口，否则全部接口返回 30402（Host 不允许）
      method-and-host:
        enabled: true
        allowed-hosts:
          - localhost:9992
          - 127.0.0.1:9992
          - localhost:*
          - 127.0.0.1:*
          # - your-domain.com:443
          # - 192.168.50.105:9992
      password:
        codec:
          # 生产必须注入环境变量 QC_SM4_KEY_HEX（32 位十六进制，16 字节 SM4 密钥）
          sm4:
            default-key-id: default
            keys:
              default: 0123456789abcdef0123456789abcdef
  oauth2:
    token-store: redis
    server:
      grant:
        password-enabled: false
        implicit-enabled: false
  monitor:
    operlog:
      print: false
    slow-sql:
      threshold-ms: 2

sa-token:
  is-log: false

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,metrics

custom:
  db:
    host: ENC(GpVad7YZj+6AB8MdEUoi77BMqmvePBduCgJSa7SW2u62+o30ezlqMbpSGENF85YCVK3k7mvNt/k7wPgvF5Xd7w==)
