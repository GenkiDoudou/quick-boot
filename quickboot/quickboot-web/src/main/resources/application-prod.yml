# 生产：MySQL。敏感连接信息建议使用 jasypt ENC(...) 或容器环境变量注入。
# 启动示例：java -Djasypt.encryptor.password=你的密钥 -jar app.jar --spring.profiles.active=prod
# 覆盖 application.yml：启用 Redis 与 Sa-Token Redis DAO（需配置 spring.data.redis.host 等）
spring:
  autoconfigure:
    exclude:
      - cloud.tianai.captcha.spring.autoconfiguration.CacheStoreAutoConfiguration
  datasource:
    url: jdbc:mysql://${custom.db.host}/qcc?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8&allowMultiQueries=true&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false
    username: ENC(fF8555kWfIEGNtLhp3mn0++zXRM/UupTJH4jahGo6B6HXw3jgmnwmN7Ib2FpgSQo)
    password: ENC(+kRG20ToqfB18dWeVJG6S4Tyj127TYjx+p3PJRwWvtW8ulJK5VvK3Vl4LHMecAbP)
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

qc:
  security:
    firewall:
      password:
        codec:
          # 生产必须注入环境变量 QC_SM4_KEY_HEX（32 位十六进制，16 字节 SM4 密钥）
          sm4:
            default-key-id: default
            keys:
              default: ${QC_SM4_KEY_HEX}
  oauth2:
    token-store: redis
    server:
      grant:
        password-enabled: false
        implicit-enabled: false
  monitor:
    operlog:
      print: false
  security:
    web:
      anonymous-paths: []

sa-token:
  is-log: false

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,metrics

custom:
  db:
    host: ENC(GpVad7YZj+6AB8MdEUoi77BMqmvePBduCgJSa7SW2u62+o30ezlqMbpSGENF85YCVK3k7mvNt/k7wPgvF5Xd7w==)
