# 本地 / 开发：内存 H2，无需 MySQL 与 jasypt 口令即可启动。
# MODE=MySQL 便于与 MySQL 方言的脚本尽量对齐；Flyway 仍会对 H2 校验方言。
#
# 验证码（tianai-captcha）在无 Redis 时会初始化失败；开发 profile 排除其自动配置。
# qc.captcha.enabled 为业务侧开关，不排除第三方 Starter，故同时使用 exclude。
qc:
  captcha:
    enabled: false

spring:
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  autoconfigure:
    exclude:
      - cloud.tianai.captcha.spring.autoconfiguration.ImageCaptchaAutoConfiguration
  datasource:
    url: jdbc:h2:file:./data/qcc;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    # Druid Wall 按 MySQL 语法解析时易误判 Flyway 内置 DDL（flyway_schema_history），开发库关闭 Wall。
    druid:
      validation-query: SELECT 1
      filter:
        wall:
          enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
