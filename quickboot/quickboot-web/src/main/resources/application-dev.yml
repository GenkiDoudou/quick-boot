# 本地 / 开发：与 prod 共用远程 MySQL（qc2），需能访问 192.168.50.105:3406
# 天爱验证码：默认 qc.captcha.store=local（见 application.yml），无需本机 Redis。
qc:
  captcha:
    enabled: true
  security:
    client-sign:
      # 勿省略积木路径：dev 会整体覆盖 application.yml 的 exclude-paths，缺则 iframe 内 /jmreport/** 返回 30002
      exclude-paths:
        - /error
        - /system/file/view/**
        - /file/preview/**
        - /oauth2/**
        - /swagger-ui.html
        - /swagger-ui/**
        - /v3/api-docs/**
        - /actuator/**
        - /jmreport/**
        - /drag/**
        - /jimubi/**
        - /jimureport/**
    web:
      anonymous-paths:
        - /actuator/**
        - /file/preview/**
        - /file/preview/**
        - /file/upload/**
        - /file/classifies
        - /file/classifies/**
    firewall:
      method-and-host:
        enabled: true
        allowed-hosts:
          - localhost:9992
          - 127.0.0.1:9992
          - localhost:*
          - 127.0.0.1:*
      password:
        codec:
          sm4:
            default-key-id: default
            keys:
              default: "0123456789abcdef0123456789abcdef"

  file:
    # @FileUrl 序列化补全：管理端预览走 view 接口（与前端 VITE_APP_BASE_API 一致）
    view-url-base: http://localhost:9992/file/preview



spring:
  flyway:
    repair-on-migrate: true
    validate-on-migrate: false
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  datasource:
    url: jdbc:mysql://192.168.50.105:3406/qc2?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8&allowMultiQueries=true&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false
    username: root
    password: rootroot
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      validation-query: SELECT 1
      filter:
        wall:
          enabled: true
          config:
            multi-statement-allow: true
            ddl-allow: true
            select-where-alway-true-check: false
            condition-and-alway-true-allow: true
        stat:
          merge-sql: true
