# 本地 / 开发：与 prod 共用远程 MySQL（qc2），需能访问 192.168.50.105:3406
# 天爱验证码：默认 qc.captcha.store=local（见 application.yml），无需本机 Redis。
qc:
  captcha:
    enabled: true
  security:
    client-sign:
      # 勿省略积木路径：dev 会整体覆盖 application.yml 的 exclude-paths，缺则 iframe 内 /jmreport/** 返回 30002
      exclude-paths:
        - /error
        - /system/file/view/**
        - /file/preview/**
        - /oauth2/**
        - /swagger-ui.html
        - /swagger-ui/**
        - /v3/api-docs/**
        - /actuator/**
        - /jmreport/**
        - /drag/**
        - /jimubi/**
        - /jimureport/**
    web:
      anonymous-paths:
        - /actuator/**
        - /file/preview/**
        - /file/preview/**
        - /file/upload/**
        - /file/classifies
        - /file/classifies/**
    firewall:
      method-and-host:
        enabled: true
        allowed-hosts:
          - localhost:9992
          - 127.0.0.1:9992
          - localhost:*
          - 127.0.0.1:*
      password:
        codec:
          sm4:
            default-key-id: default
            keys:
              default: "0123456789abcdef0123456789abcdef"

  file:
    # @FileUrl 序列化补全：管理端预览走 view 接口（与前端 VITE_APP_BASE_API 一致）
    view-url-base: http://localhost:9992/file/preview
  knowledge:
    enabled: true
    ollama-required: false
    vector-dimensions: 768
    vector-datasource:
      url: jdbc:postgresql://192.168.50.105:5433/quickboot_vector
      username: vector
      password: vector
  ai:
    enabled: true
    vector-dimensions: 768
    registry:
      fallback-to-yaml: true
      client-cache-ttl-seconds: 300
      test-timeout-ms: 20000
    export:
      include-secrets: false
  workflow:
    enabled: true
    external-api:
      enabled: false
    sync-debug-timeout-ms: 60000
    async-timeout-ms: 600000
    max-concurrent-runs-per-user: 5
    stream:
      heartbeat-interval-ms: 15000
    http-request:
      enabled: true
      timeout-ms: 15000
      max-bytes: 5242880
  monitor:
    slow-sql:
      threshold-ms: 50


spring:
  flyway:
    repair-on-migrate: true
    validate-on-migrate: false
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  ai:
    # Chat：DeepSeek；Embedding：阿里云百炼（OpenAI 兼容），二者可独立 base-url / api-key
    model:
      chat: openai
      embedding: openai
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:sk-9b1dead04d84410184841df956c91552}
      chat:
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY:sk-9b1dead04d84410184841df956c91552}
        # DeepSeek 官方路径为 /chat/completions（Spring AI 默认 /v1/chat/completions）
        completions-path: /chat/completions
        options:
          model: deepseek-v4-pro
          temperature: 0.3
      embedding:
        # 勿带 /v1 后缀：Spring AI 会自动拼接 /v1/embeddings
        base-url: https://dashscope.aliyuncs.com/compatible-mode
        api-key: ${DASHSCOPE_API_KEY:sk-4fd228f1d8e5444a8668a60f8fe4b0b0}
        options:
          model: text-embedding-v4
          dimensions: 768
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  datasource:
    url: jdbc:mysql://192.168.50.105:3406/qc2?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8&allowMultiQueries=true&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false
    username: root
    password: rootroot
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      validation-query: SELECT 1
      filter:
        wall:
          enabled: true
          config:
            multi-statement-allow: true
            ddl-allow: true
            select-where-alway-true-check: false
            condition-and-alway-true-allow: true
        stat:
          merge-sql: true
          log-slow-sql: true
          slow-sql-millis: 500
