server:
  port: 9992
  servlet:
    session:
      cookie:
        name: 'JSESSIONID_${spring.application.name}'
  tomcat:
    max-http-form-post-size: -1  # 不限制表单提交大小
spring:
  application:
    name: quickboot-web
  profiles:
    # 本地开发默认 dev（与 prod 同款远程 MySQL）；生产部署请显式指定 --spring.profiles.active=prod
    active: dev
  # tianai 默认 CacheStore 自动配置与本模块 TianaiCacheStoreAutoConfiguration 二选一；
  # 不可在 AutoConfiguration 类上使用 @EnableAutoConfiguration(exclude=…) 排除同类，否则会循环 @Import。
  autoconfigure:
    exclude:
      - cloud.tianai.captcha.spring.autoconfiguration.CacheStoreAutoConfiguration
      # qc.oauth2.token-store=local 时禁用 Redis 与 Sa-Token Redis DAO（见 application-prod.yml 恢复）
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - cn.dev33.satoken.dao.SaTokenDaoForRedisTemplate
  data:
    redis:
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8 # 连接池最大连接数（使用负值表示没有限制）
          max-idle: 8 # 连接池最大空闲连接数
          max-wait: 10000ms # 连接池最大阻塞等待时间
          min-idle: 0 # 连接池最小空闲连接数
        shutdown-timeout: 100ms # 连接池关闭超时时间
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      filter:
        slf4j:
          connection-log-enabled: false
          data-source-log-enabled: false
          enabled: true
          result-set-log-enabled: false
          statement-executable-sql-log-enable: true
          statement-log-enabled: false
        stat:
          enabled: true
          merge-sql: true
          log-slow-sql: true
          slow-sql-millis: 2000
        wall:
          config:
            multi-statement-allow: true
            # 积木报表 / JimuBI（MiniDao）动态 SQL 常用 where 1=1，Druid 1.2.22+ 默认会拦截
            select-where-alway-true-check: false
            condition-and-alway-true-allow: true
          enabled: true
      initial-size: 5
      max-active: 20
      max-wait: 60000
      min-idle: 5
      stat-view-servlet:
        enabled: true
        login-password: 3wkp9XkF7Rir
        login-username: admin
      web-stat-filter:
        enabled: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss # jackson日期格式化
    time-zone: GMT+8
    default-property-inclusion: non_null # 序列化时默认包含非空属性
  mvc:
    format:
      date: yyyy-MM-dd # mvc日期格式化
      date-time: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      enabled: true # 开启文件上传
      max-file-size: 100MB # 单个文件最大大小
      max-request-size: 1000MB # 总请求大小
  flyway:
    enabled: true
    encoding: utf-8
    # 积木脚本 JSON 中含 ${jm_expression.num} 等，勿当作 Flyway 占位符
    placeholder-replacement: false
    clean-disabled: true
    ## 迁移sql脚本文件存放路径，默认db/migration
    locations: classpath:db/migration
    ## 迁移sql脚本文件名称的前缀，默认V
    sql-migration-prefix: V
    ## 迁移sql脚本文件名称的分隔符，默认2个下划线__
    sql-migration-separator: __
    # 迁移sql脚本文件名称的后缀
    sql-migration-suffixes: .sql
    validate-on-migrate: true
    # 设置为true，当迁移发现数据库非空且存在没有元数据的表时，自动执行基准迁移，新建schema_version表
    baseline-on-migrate: true
  cache:
    type: caffeine
  messages:
    basename: i18n/messages
    encoding: UTF-8

mybatis-plus:
  configuration:
    cache-enabled: true
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: del_flag
      logic-delete-value: 1
      logic-not-delete-value: 0
      insert-strategy: not_empty
      update-strategy: not_null
      where-strategy: not_empty
  mapper-locations: classpath*:mapper/**/*.xml
jasypt:
  encryptor:
    bootstrap: true
    algorithm: PBEWithHMACSHA256AndAES_128
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator

qc:
  oauth2:
    # local：内存（默认，无需 Redis）；redis：多实例部署时在 prod 配置 spring.data.redis 并改为 redis
    token-store: local
    server:
      enabled: true
      issuer: ''
      grant:
        password-enabled: false
        implicit-enabled: false
    client:
      enabled: true
      default-redirect-after-login: /
  # 登录页天爱行为验证码：为 false 时 /login 不校验 captchaId；前端登录页 GET /login/captcha-config 同步隐藏验证码
  login:
    captcha-enabled: false
  jimu:
    enabled: true
    base-url: http://localhost:9992
    # 生产多实例 / JimuBI WebSocket 协同可开 Redis；本地 dev 无 Redis 也可解析数据集 SQL
    redis:
      enabled: false
    primary-datasource:
      sync-on-startup: true
      name: QuickBoot主库
      code: qc2
    share:
      enabled: true
  monitor:
    operlog:
      capture-enabled: true
      # 控制台打印请求摘要（methodName/uri/params/result 等，参照旧栈 WebPrintLoggerEventListener）
      print: true
      # 异步落库，避免同步 insert 拖慢接口（生产建议保持 true）
      async-enabled: true
      export-max-rows: 10000
    job:
      export-max-rows: 10000
    slow-sql:
      capture-enabled: true
      threshold-ms: 1000
      log-enabled: true
      async-enabled: true
      export-max-rows: 10000
      max-sql-length: 4000
  security:
    web:
      # 额外匿名路径（生产保持空；开发见 application-dev.yml）
      # /file/upload、/file/classifies 放行后由 FileAccessService 按分类 anonymous 校验上传登录
      anonymous-paths:
        - /file/preview/**
        - /file/upload/**
        - /file/classifies
        - /file/classifies/**
    # 首方/第三方 Client HMAC 签名校验（见 docs/superpowers/specs/2026-05-23-oauth2-integration-design.md §16）
    client-sign:
      enabled: true
      window-seconds: 300
      nonce-cache-name: clientSignNonce#300
      exclude-paths:
        - /error
        - /system/file/view/**
        - /oauth2/**
        - /swagger-ui.html
        - /swagger-ui/**
        - /v3/api-docs/**
        - /jmreport/**
        - /drag/**
        - /jimubi/**
        - /jimureport/**
    firewall:
      headers:
        enabled: true
        # 积木 iframe 由前端(如 :8800)嵌入后端(:9992)，须跳过 X-Frame-Options:SAMEORIGIN，否则中间区域无法展示
        exclude-urls:
          - /jmreport/**
          - /drag/**
          - /jimubi/**
          - /jimureport/**
        # exclude-from-strict-policy-urls:   # 命中则只保留基础四头，不注入 CSP/HSTS/Permissions-Policy
        #   - /v3/api-docs/**
        #   - /swagger-ui/**
      sensitive-word:
        # 是否启用敏感词过滤（BREAKING：旧键 enable 已更名为 enabled，与 headers.enabled 一致）
        enabled: true
        # 敏感词白名单文件路径（多个）
        # 白名单中的词不会被过滤
        whiteList:
          - classpath:sensitive-word-white.txt
          # - file:/path/to/white-list.txt

        # 敏感词黑名单文件路径（多个）
        # 黑名单中的词会被过滤
        blackList:
          - classpath:sensitive-word-black.txt
          # - file:/path/to/black-list.txt

        # 忽略敏感词过滤的 URL 列表
        # 支持 Ant 风格路径匹配
        ignoreUrls:
          - /login
          - /jmreport/**
          - /drag/**
          - /jimubi/**
          - /jimureport/**

        # REPLACE | THROW（推荐大写；小写 throw 在部分环境下亦可绑定）
        strategy: THROW
      method-and-host:
        enabled: true
        forbidden-message: 请求 Host 不在允许范围内
        # 与请求头 Host 完全一致（含端口）；127.0.0.1 与 localhost 不等价
        allowed-hosts:
          - localhost:9992
          - 127.0.0.1:9992
      sql-injection:
        enabled: true
        forbidden-message: 您的请求包含非法字符，请检查！
        # Ant 路径 /** 会误命中关键字 /*；OAuth 客户端「接口授权」字段默认已跳过
        ignore-json-fields:
          - apiPathPatterns
        ignoreUrls:
          # 监控批次 events 含业务 API 路径（如 /system/user/update），会误触 update 等关键字
          - /monitor/clientTrack/report
          - /jmreport/**
          - /drag/**
          - /jimubi/**
          - /jimureport/**
      xss:
        enabled: true
        forbidden-message: 您的请求包含非法字符，请检查！
        ignoreUrls:
          - /monitor/clientTrack/report
          - /jmreport/**
          - /drag/**
          - /jimubi/**
          - /jimureport/**
      idempotent:
        enabled: true
        # TOKEN-only：仅当请求头非空时占位；缺头不报错。cache-type: auto|redis|caffeine（auto=有 RedisConnectionFactory 则用 Redis）
        # intercept-methods: [ POST, PUT, DELETE ]
        # exclude-urls: []
        # token-header: X-Idempotent-Token
        key-prefix: 'qc:idempotent:'
        cache-type: caffeine
        expire-time: 60
      cors:
        enabled: true
        allowed-origins:
          - '*'
  captcha:
    enabled: true
    type: SLIDER
    # local：内存 CacheStore（本地开发无 Redis）；redis：使用 StringRedisTemplate
    store: local
  file:
    enabled: true
    type: local
    default-classify: default
    classifies:
      - classify:  default
        limit-size: 10MB
        limit-count: 5
        anonymous:  true
      - classify: avatar
        limit-size: 10MB
        limit-count: 1
        anonymous:  false
      - classify: thumb
        limit-size: 512KB
        limit-count: 3
        limit-ext: png,jpg,jpeg,webp
        anonymous:  false
      - classify: import-source
        limit-size: 100MB
        limit-count: 1
        limit-ext: xls,xlsx
        anonymous:  false
      - classify: import-error
        limit-size: 50MB
        limit-count: 1
        limit-ext: xls,xlsx
        anonymous:  false
      - classify: export-result
        limit-size: 100MB
        limit-count: 1
        limit-ext: xls,xlsx
        anonymous:  false
  import:
    enabled: true
    sync-max-rows: 500
    sync-max-rows-cap: 2000
    sync-timeout-seconds: 120
    async-max-concurrent: 3
    staging-batch-size: 200
    file-retention-days: 7
    source-classify: import-source
    error-classify: import-error
  export:
    enabled: true
    sync-max-rows: 500
    sync-max-rows-cap: 5000
    sync-timeout-seconds: 120
    async-max-concurrent: 3
    async-max-rows: 50000
    result-classify: export-result


# Actuator 最小暴露
management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0   # 100% 采样
  otlp:
    tracing:
      endpoint: http://localhost:4317

##  验证码配置
# 行为验证码配置， 详细请看 cloud.tianai.captcha.autoconfiguration.ImageCaptchaProperties 类
captcha:
  # 如果项目中使用到了redis，滑块验证码会自动把验证码数据存到redis中， 这里配置redis的key的前缀,默认是captcha:slider
  # 验证码过期时间，默认是2分钟,单位毫秒， 可以根据自身业务进行调整
  expire:
    # 默认缓存时间 2分钟
    default: 10000
    # 针对 点选验证码 过期时间设置为 2分钟， 因为点选验证码验证比较慢，把过期时间调整大一些
    WORD_IMAGE_CLICK: 20000
  # 使用加载系统自带的资源， 默认是 false(这里系统的默认资源包含 滑动验证码模板/旋转验证码模板,如果想使用系统的模板，这里设置为true)
  init-default-resource: true
  # 缓存控制， 默认为false不开启
  local-cache-enabled: true
  # 缓存开启后，验证码会提前缓存一些生成好的验证数据， 默认是20
  local-cache-size: 20
  # 缓存开启后，缓存拉取失败后等待时间 默认是 5秒钟
  local-cache-wait-time: 5000
  # 缓存开启后，缓存检查间隔 默认是2秒钟
  local-cache-period: 2000
  # 缓存开启后，忽略的字段，默认是 ""(不忽略任何字段)
  local-cache-ignored-cache-fields: ""
  secondary:
    # 二次验证， 默认false 不开启
    enabled: true
    # 二次验证key过期时间， 默认 2分钟
    expire: 120000
    # 二次验证缓存key前缀，默认是 captcha:secondary
    keyPrefix: "captcha:secondary"
# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

############## 代码生成 ##############
quickboot:
  gen:
    author: quickboot
    package-name: io.github.genkidoudou.web
    module-name: system
    zip-file-name: quickboot.zip
    create-table-max-statements: 10

############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # 会话持久化：qc.oauth2.token-store=redis 且配置 spring.data.redis 时由 SaTokenDaoForRedisTemplate 接管
  # 与 quick-ui axios 拦截器一致：Authorization: Bearer <token>
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  is-read-cookie: false
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true
