# 登录 / 验证码（ErrorCodes.Auth）
30010=验证码服务未启用
30011=验证码二次校验未配置
30012=请先完成验证码验证
30013=验证码已失效，请重试
30014=账号已锁定，请{0}秒后重试
30015=账号已锁定，请稍后再试
30016=用户名或密码错误
30017=账号已停用
30018=用户名或密码错误次数过多，账号已锁定，请稍后再试
## 客户端
10001=客户端{0}已经存在,请勿重复添加
10002=客户端{0}不存在
## 角色（ErrorCodes.Role）
20030=参数非法: {0}
20031=角色{0}不存在
20032=权限字符{0}已存在
20033=不允许删除超级管理员角色
20034=角色已分配用户，无法删除: {0}
20035=status 仅支持 0/1
## 菜单（ErrorCodes.Menu）
20040=参数非法: {0}
20041=菜单{0}不存在
20042=存在子菜单，不允许删除
20043=上级菜单不能选择自己
20044=菜单类型仅支持 M/C/F
