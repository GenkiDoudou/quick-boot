qc:
  security:
    firewall:
      cors:
        # 开发环境开启 CORS（对齐 bak）；生产请收紧 allowed-origins
        enabled: true
        allowed-origins:
          - '*'
  oauth:
    # 是否开启
    enable: true
    # XOR 盐，须与前端 oauthClientBasic.js 的 QuickBootOAuth1 一致
    key: QuickBootOAuth1
    ignore-url:
      - /actuator/**
      - /api/captcha/generate
      - /api/captcha/validate
      - /jmreport/**
      - /drag/**
      - /jimubi/**
      - /jimureport/**
  jimu:
    enabled: true
    # iframe 直连本后端；须与 server.port 一致
    base-url: http://localhost:9993
    redis:
      enabled: true
    primary-datasource:
      sync-on-startup: true
      name: QuickBoot主库
      code: qc2
    share:
      enabled: true
  login:
    max-retry: 5
    lock-minutes: 10
  gen:
    author: quickboot
    package-name: io.github.genkidoudou.system
    module-name: system
    zip-file-name: quickboot.zip
    create-table-max-statements: 10
  monitor:
    operlog:
      capture-enabled: true
      # 控制台打印请求摘要（参照 bak WebPrintLoggerEventListener）
      print: true
    slow-sql:
      # 开发环境降低阈值便于冒烟；0=全部采集（本地嵌入式库多数 SQL <50ms）
      threshold-ms: 0
  dev:
    embedded-redis:
      # 进程内 Luban-RDS；关闭后请自行提供外部 Redis
      enabled: true
      port: 6379
    embedded-mariadb:
      # 进程内 mariadb4j；关闭后请自行提供外部 MariaDB/MySQL，并改 spring.datasource
      enabled: true
      port: 3307
      data-dir: ./data/mariadb
      base-dir: ./data/mariadb-base
      database: quickboot
      username: root
      password: ""
  captcha:
    enabled: true
    store: redis
    type: SLIDER
  file:
    enabled: true
    type: local
    local:
      path: ./data/uploads
    view-url-base: http://localhost:9993/system/file/view
    default-classify: default
    compress:
      # 服务端总开关；min-size/quality/max-edge 为分类未配置时的默认
      enabled: false
      min-size-kb: 200
      quality: 0.85
      max-edge: 1920
# 天爱官方前缀：登录二次校验依赖 SecondaryVerificationApplication
captcha:
  secondary:
    enabled: true
sa-token:
  # 与前端 Authorization: Bearer 对齐
  token-name: Authorization
  token-prefix: Bearer
  timeout: 604800
  # 30 分钟无请求则失效；有请求则续期。观测：登录后停满 active-timeout 再带 token 调需登录接口，应 401
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-cookie: false
spring:
  application:
    name: quickboot-app
  datasource:
    # 本地嵌入式 MariaDB（mariadb4j）；数据目录 qc.dev.embedded-mariadb.data-dir
    url: jdbc:mariadb://127.0.0.1:${qc.dev.embedded-mariadb.port}/${qc.dev.embedded-mariadb.database}?characterEncoding=utf8&useUnicode=true&connectionCollation=utf8mb4_unicode_ci&allowMultiQueries=true&maxAllowedPacket=268435456
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${qc.dev.embedded-mariadb.username}
    password: ${qc.dev.embedded-mariadb.password}
    druid:
      db-type: mysql
      filter:
        slf4j:
          # 避免 Flyway 大脚本失败时把整段 SQL 打到日志导致卡死
          statement-executable-sql-log-enable: false
          statement-log-enabled: false
          # Flyway 探测 Galera 会查 @@GLOBAL.WSREP_ON；嵌入式 MariaDB 无此变量，失败被 Flyway 吞掉，勿打 ERROR 堆栈
          statement-log-error-enabled: false
        wall:
          # Flyway V15（积木演示）含超大 INSERT，Wall 解析会长时间卡住；业务 SQL 仍可在 prod 开 Wall
          enabled: false
        stat:
          merge-sql: false
          enabled: true
  sql:
    init:
      # 已改用 Flyway（classpath:db/migration），禁止 always 重复执行种子
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 积木演示 JSON 含 ${…}，禁止 Flyway 占位符替换
    placeholder-replacement: false
    # 本地改过已应用 SQL 的 checksum 对齐：见 DevFlywayRepairConfiguration（repair → migrate）
    # 全新 data-dir 首次迁移全量执行；baseline 保留兼容旧库场景
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: 127.0.0.1
      # 须与 qc.dev.embedded-redis.port 一致
      port: 6379
      timeout: 10000ms
