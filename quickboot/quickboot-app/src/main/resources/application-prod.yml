# 生产 Profile：可变连接信息来自进程工作目录下的 .env.properties
# （spring.config.import: optional:file:./.env.properties，见 application.yml）
# 目标机由运维维护该文件；Jenkins 发版不覆盖。骨架见同目录 .env.properties.example

qc:
  security:
    firewall:
      cors:
        # 同域 Nginx 反代时可关闭；若前后端跨域再收紧 allowed-origins
        enabled: false
  oauth:
    enable: true
    key: QuickBootOAuth1
    ignore-url:
      - /actuator/**
      - /api/captcha/generate
      - /api/captcha/validate
      - /jmreport/**
      - /drag/**
      - /jimubi/**
      - /jimureport/**
  jimu:
    enabled: true
    # 公网可访问的后端根地址；可按环境在 .env 增加键后改为 ${QC_JIMU_BASE_URL}
    base-url: http://127.0.0.1:9993
    redis:
      enabled: true
    primary-datasource:
      sync-on-startup: true
      name: QuickBoot主库
      code: qc2
    share:
      enabled: true
  login:
    max-retry: 5
    lock-minutes: 10
  gen:
    author: quickboot
    package-name: io.github.genkidoudou.system
    module-name: system
    zip-file-name: quickboot.zip
    create-table-max-statements: 10
  monitor:
    operlog:
      capture-enabled: true
      print: false
    slow-sql:
      threshold-ms: 2000
  # 生产必须关闭嵌入式组件，连接 .env.properties 中的外部 DB/Redis
  dev:
    embedded-redis:
      enabled: false
    embedded-mariadb:
      enabled: false
  captcha:
    enabled: true
    store: redis
    type: SLIDER
  file:
    enabled: true
    type: local
    local:
      path: ./data/uploads
    view-url-base: http://127.0.0.1:9993/system/file/view
    default-classify: default
    compress:
      enabled: false
      min-size-kb: 200
      quality: 0.85
      max-edge: 1920

captcha:
  secondary:
    enabled: true

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 604800
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-cookie: false

spring:
  application:
    name: quickboot-app
  datasource:
    # DB_URL 不含查询串；查询参数在下方拼接（与本地 Flyway/多语句需求一致）
    url: ${DB_URL}?characterEncoding=utf8&useUnicode=true&connectionCollation=utf8mb4_unicode_ci&allowMultiQueries=true&maxAllowedPacket=268435456
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    druid:
      db-type: mysql
      filter:
        slf4j:
          statement-executable-sql-log-enable: false
          statement-log-enabled: false
          statement-log-error-enabled: false
        wall:
          enabled: true
        stat:
          merge-sql: true
          enabled: true
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholder-replacement: false
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10000ms
