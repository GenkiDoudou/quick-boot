# 加密配置示例
# 复制到 application.yml 或 application-dev.yml 中使用

security:
  encryption:
    enabled: true  # 总开关
    request:
      enabled: true  # 请求加密开关
      algorithm: AES  # 加密算法：AES/RSA
      key-exchange: RSA  # 密钥交换方式：RSA
    response:
      enabled: true  # 响应加密开关
      algorithm: AES
    signature:
      enabled: true  # 签名验证开关
      algorithm: HMAC-SHA256  # 签名算法：HMAC-SHA256/RSA-SHA256
      secret-key: ${ENCRYPTION_SECRET_KEY:your-secret-key-here}  # HMAC密钥（环境变量，默认值）
      expire-time: 300  # 签名有效期（秒）
    ignore-urls:  # 忽略加密/签名的URL
      - /login
      - /captchaImage
      - /actuator/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /doc.html
