# ================================
# 安全头配置示例
# ================================
# 用于防止点击劫持、XSS、MIME 嗅探等攻击
# 默认启用，可通过 qc.security.firewall.headers.enabled=false 关闭

qc:
  security:
    firewall:
      headers:
        # 是否启用安全头（默认 true）
        enabled: true

        # X-Frame-Options：防止点击劫持
        # DENY - 禁止任何页面嵌入
        # SAMEORIGIN - 仅允许同源页面嵌入
        frame-options: SAMEORIGIN

        # X-Content-Type-Options：防止 MIME 类型嗅探
        content-type-options: nosniff

        # X-XSS-Protection：启用浏览器 XSS 过滤器
        # 0-关闭 | 1-启用 | 1; mode=block-启用并阻止
        xss-protection: 1; mode=block

        # Referrer-Policy：控制 Referer 头
        referrer-policy: strict-origin-when-cross-origin

        # Content-Security-Policy：内容安全策略（可选）
        # content-security-policy: "default-src 'self'"

        # Strict-Transport-Security：强制 HTTPS（仅 HTTPS 站点建议启用）
        # strict-transport-security: "max-age=31536000; includeSubDomains"

        # Permissions-Policy：功能权限控制（可选）
        # permissions-policy: "geolocation=(), microphone=()"

        # 排除的 URL 列表（不添加安全头）
        exclude-urls:
          - /actuator/**
          - /error
