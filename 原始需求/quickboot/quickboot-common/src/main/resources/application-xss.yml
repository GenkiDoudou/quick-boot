# ================================
# XSS 脚本注入拦截配置示例
# ================================

qc:
  security:
    firewall:
      xss:
        # 是否启用 XSS 拦截（默认 false）
        enabled: true

        # 忽略拦截的 URL 列表（Ant 风格）
        ignore-urls:
          - /actuator/**
          - /v3/api-docs/**
          - /swagger-ui/**
          - /swagger-ui.html

        # 自定义检测模式（正则表达式，可选）
        # custom-patterns:
        #   - "<custom-dangerous-pattern>"
