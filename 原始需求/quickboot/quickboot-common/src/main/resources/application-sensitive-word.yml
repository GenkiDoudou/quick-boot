# ================================
# 敏感词过滤配置示例
# ================================

qc:
  security:
    firewall:
      sensitive-word:
        # 是否启用敏感词过滤
        enable: true
        
        # 敏感词白名单文件路径（多个）
        # 白名单中的词不会被过滤
        whiteList:
          - classpath:sensitive-word-white.txt
          # - file:/path/to/white-list.txt
        
        # 敏感词黑名单文件路径（多个）
        # 黑名单中的词会被过滤
        blackList:
          - classpath:sensitive-word-black.txt
          # - file:/path/to/black-list.txt
        
        # 忽略敏感词过滤的 URL 列表
        # 支持 Ant 风格路径匹配
        ignoreUrls:
          - /login
          - /register
          - /api/public/**
        
        # 敏感词过滤策略
        # REPLACE: 替换为 *
        # THROW: 抛出异常
        strategy: REPLACE
