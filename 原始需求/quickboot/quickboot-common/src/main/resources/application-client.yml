# 客户端管理模块配置示例
qc:
  security:
    firewall:
      client:
        # 是否启用客户端认证
        enabled: false
        # 数据源类型：config(配置文件) 或 database(数据库)
        source: config
        # 客户端ID的Header名称
        client-id-header: X-Client-Id
        # 客户端密钥的Header名称
        client-secret-header: X-Client-Secret
        # 排除的URL（不需要客户端认证）
        exclude-urls:
          - /health
          - /actuator/**
          - /api/public/**
        # 客户端列表（仅当 source=config 时有效）
        clients:
          - client-id: app001
            client-secret: secret001
            public-key: MFkwEwYHKoZIzj0CAQYIKoEcz1UBgi0DQgAE...
            sign-key: sign-key-001
            enabled: true
            remark: 移动端应用
          - client-id: app002
            client-secret: secret002
            public-key: MFkwEwYHKoZIzj0CAQYIKoEcz1UBgi0DQgAE...
            sign-key: sign-key-002
            enabled: true
            remark: Web端应用
