# ==================== Common Errors 1xxxx ====================
10000=Internal server error
10001=Validation failed
10002=Resource not found
10003=Operation failed

# ==================== Business Errors 2xxxx ====================
20001=User not found
20002=User already exists
20003=Incorrect password

# ==================== Security Errors 3xxxx ====================
30001=Permission denied
30002=Authentication failed
30003=Invalid token
30004=Token expired

# ==================== Client Authentication Errors 301xx ====================
30101=Client not found: {0}
30102=Client disabled: {0}
30103=Client expired: {0}
30104=Invalid client secret: {0}
30105=Missing client credentials

# ==================== Idempotent Errors 302xx ====================
30201=Duplicate request, please try again later

# ==================== Referer Filter Errors 303xx ====================
30301=Referer not allowed: {0}

# ==================== Method and Host Filter Errors 304xx ====================
30401=Method not allowed: {0}
30402=Host not allowed: {0}

# ==================== Sensitive Word Errors 305xx ====================
30501=Sensitive word detected: {0}

# ==================== System Errors 4xxxx ====================
40001=Database error
40002=Network error
40003=File operation error
40004=Cache error
