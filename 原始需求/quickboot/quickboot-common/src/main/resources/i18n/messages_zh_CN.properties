# ==================== 通用错误 1xxxx ====================
10000=系统内部错误
10001=参数校验失败
10002=资源不存在
10003=操作失败

# ==================== 业务错误 2xxxx ====================
20001=用户不存在
20002=用户已存在
20003=密码错误

# ==================== 安全相关错误 3xxxx ====================
30001=权限不足
30002=认证失败
30003=Token 无效
30004=Token 过期

# ==================== 客户端认证错误 301xx ====================
30101=客户端不存在: {0}
30102=客户端已禁用: {0}
30103=客户端已过期: {0}
30104=客户端密钥错误: {0}
30105=缺少客户端认证信息

# ==================== 防幂等错误 302xx ====================
30201=重复请求,请稍后再试

# ==================== 请求来源拦截错误 303xx ====================
30301=请求来源不允许: {0}

# ==================== 请求方式和域名拦截错误 304xx ====================
30401=请求方式不允许: {0}
30402=请求域名不允许: {0}

# ==================== 敏感词过滤错误 305xx ====================
30501=检测到敏感词: {0}

