# PostgreSQL + pgvector（知识库向量存储）
# 默认映射宿主机 5433 -> 容器 5432，避免与本地已有 Postgres 冲突
#
# 启动：./deploy.sh  或  .\deploy.ps1
# 手动：docker compose --env-file .env up -d

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: quickboot-pgvector
    restart: unless-stopped
    ports:
      - "${PGVECTOR_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quickboot_vector}
      POSTGRES_USER: ${POSTGRES_USER:-vector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vector}
      TZ: Asia/Shanghai
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vector} -d ${POSTGRES_DB:-quickboot_vector}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgvector_data:
