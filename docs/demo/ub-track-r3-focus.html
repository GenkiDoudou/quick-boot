<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R3 用户行为轨迹 · 大轨迹下钻</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2/dist/index.css" />
  <style>
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
    .top { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 12px 20px; display: flex; gap: 12px; align-items: center; }
    .top a { color: #2563eb; text-decoration: none; font-size: 13px; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 20px 16px 48px; }
    .sum {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px 16px; margin-bottom: 18px;
      font-size: 15px; font-weight: 650;
    }
    .sum .muted { color: #64748b; font-weight: 500; font-size: 12px; margin-bottom: 6px; }
    .sum .path { font-family: ui-monospace, Consolas, monospace; font-size: 14px; color: #2563eb; word-break: break-all; }
    .step { margin-bottom: 12px; }
    .page {
      background: #fff; border: 2px solid #e2e8f0; border-radius: 14px; padding: 16px 18px; cursor: pointer;
      transition: .12s border-color;
    }
    .page.on { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .page .idx { display: inline-flex; width: 32px; height: 32px; border-radius: 50%; background: #2563eb; color: #fff; align-items: center; justify-content: center; font-weight: 800; margin-right: 10px; }
    .page .title { font-size: 18px; font-weight: 750; display: inline; }
    .page .mono { display: block; margin-top: 8px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #64748b; }
    .bridge {
      margin: 6px 0 6px 24px; color: #2563eb; font-size: 13px; font-weight: 650;
      border-left: 3px solid #93c5fd; padding: 6px 0 6px 14px;
    }
    .ops { margin: 10px 0 0 42px; display: none; }
    .page.on .ops { display: block; }
    .op {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
    }
    .op:hover { border-color: #f59e0b; background: #fffbeb; }
    .op .n { font-weight: 650; font-size: 14px; }
    .op .m { font-size: 12px; color: #64748b; margin-top: 2px; }
    .hint { font-size: 12px; color: #94a3b8; margin: 8px 0 0 42px; display: none; }
    .page.on .hint { display: block; }
  </style>
</head>
<body>
  <div class="top">
    <a href="./user-behavior-journey-picker.html">← 选型</a>
    <strong>R3 · 大轨迹 + 抽屉下钻</strong>
  </div>
  <div id="app" class="wrap">
    <div class="sum">
      <div class="muted">行为轨迹（一眼看清从哪到哪）</div>
      <div class="path">{{ pathText }}</div>
    </div>

    <template v-for="(pg, i) in pages" :key="pg.id">
      <div class="step">
        <div class="page" :class="{ on: pageId === pg.id }" @click="pageId = pg.id">
          <span class="idx">{{ i + 1 }}</span>
          <span class="title">{{ pg.title }}</span>
          <span class="mono">{{ pg.path }} · {{ pg.actions.length }} 个操作</span>
          <div class="hint">展开后点操作 → 右侧抽屉看接口瀑布</div>
          <div class="ops" @click.stop>
            <div v-for="a in pg.actions" :key="a.id" class="op" @click="open(a)">
              <div>
                <div class="n">{{ a.name }}</div>
                <div class="m">{{ a.time }} · {{ a.apiCount }} 个接口</div>
              </div>
              <el-button type="primary" size="small">看接口</el-button>
            </div>
          </div>
        </div>
        <div v-if="i < pages.length - 1" class="bridge">↓ 从 {{ pg.path }} 进入 {{ pages[i + 1].path }}</div>
      </div>
    </template>

    <el-drawer v-model="visible" :title="drawerTitle" size="460px">
      <template v-if="cur">
        <p style="font-size:13px;color:#64748b;margin-top:0">{{ cur.name }} · {{ cur.traceId }}</p>
        <div style="font-size:12px;font-weight:700;margin-bottom:8px">瀑布（对齐请求链路）</div>
        <div v-for="(s, i) in cur.spans" :key="i" style="display:grid;grid-template-columns:1fr 100px 48px;gap:8px;align-items:center;font-size:12px;margin-bottom:6px">
          <div>
            <div style="font-family:ui-monospace,Consolas,monospace;word-break:break-all">{{ s.name }}</div>
            <div style="color:#94a3b8;font-size:11px">{{ s.kindLabel }}</div>
          </div>
          <div style="height:14px;background:#e2e8f0;border-radius:3px;position:relative">
            <div :style="{ position:'absolute', top:'2px', height:'10px', left:s.start+'%', width:Math.max(s.width,2)+'%', background: s.kind==='sql' ? '#f59e0b' : '#8b5cf6', borderRadius:'2px' }"></div>
          </div>
          <div style="text-align:right;color:#64748b">{{ s.ms }}ms</div>
        </div>
        <pre v-if="cur.sqlPreview" style="margin-top:12px;padding:10px;background:#0f172a;color:#e2e8f0;border-radius:8px;font-size:11px;white-space:pre-wrap;word-break:break-all">{{ cur.sqlPreview }}</pre>
      </template>
    </el-drawer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2/dist/index.full.min.js"></script>
  <script>
    const { createApp, ref, computed } = Vue
    const pages = [
      { id: 'p1', title: '工作台', path: '/home', actions: [{ id: 'a0', name: '停留浏览', time: '16:40:01', apiCount: 0, traceId: '—', spans: [], sqlPreview: '' }] },
      {
        id: 'p2', title: '用户管理', path: '/system/user',
        actions: [
          { id: 'a1', name: '加载用户列表', time: '16:40:18', apiCount: 1, traceId: 'tr_list_01',
            spans: [
              { name: 'GET /system/user/list', kind: 'api', kindLabel: '接口', start: 0, width: 55, ms: 120 },
              { name: 'SysUserMapper.selectPage', kind: 'sql', kindLabel: 'SQL', start: 8, width: 12, ms: 8 }
            ], sqlPreview: 'SELECT * FROM sys_user ...' },
          { id: 'a2', name: '点击「新增」按钮', time: '16:40:25', apiCount: 2, traceId: 'tr_add_02',
            spans: [
              { name: 'GET /system/user/deptTree', kind: 'api', kindLabel: '接口', start: 0, width: 40, ms: 42 },
              { name: 'GET /system/dict/.../sys_user_sex', kind: 'api', kindLabel: '接口', start: 5, width: 22, ms: 18 },
              { name: 'SysDeptMapper.selectList', kind: 'sql', kindLabel: 'SQL', start: 6, width: 8, ms: 3 }
            ], sqlPreview: 'SELECT ... FROM sys_dept' },
          { id: 'a3', name: '点击「修改」按钮', time: '16:40:40', apiCount: 1, traceId: 'tr_edit_03',
            spans: [
              { name: 'GET /system/user/1152', kind: 'api', kindLabel: '接口', start: 0, width: 48, ms: 56 },
              { name: 'SysUserMapper.selectById', kind: 'sql', kindLabel: 'SQL', start: 4, width: 10, ms: 2 }
            ], sqlPreview: 'SELECT * FROM sys_user WHERE user_id = 1152' },
          { id: 'a4', name: '点击「删除」按钮', time: '16:40:55', apiCount: 1, traceId: 'tr_del_04',
            spans: [
              { name: 'DELETE /system/user/1201', kind: 'api', kindLabel: '接口', start: 0, width: 60, ms: 78 },
              { name: 'SysUserMapper.updateDelFlag', kind: 'sql', kindLabel: 'SQL', start: 10, width: 14, ms: 4 }
            ], sqlPreview: 'UPDATE sys_user SET del_flag = 1 ...' }
        ]
      },
      {
        id: 'p3', title: '新建用户', path: '/system/user/form',
        actions: [
          { id: 'a5', name: '点击「保存」按钮', time: '16:41:05', apiCount: 1, traceId: 'tr_save_05',
            spans: [
              { name: 'POST /system/user', kind: 'api', kindLabel: '接口', start: 0, width: 70, ms: 86 },
              { name: 'SysUserMapper.insert', kind: 'sql', kindLabel: 'SQL', start: 12, width: 10, ms: 5 }
            ], sqlPreview: 'INSERT INTO sys_user ...' }
        ]
      }
    ]
    createApp({
      setup() {
        const pageId = ref('p2')
        const visible = ref(false)
        const cur = ref(null)
        const pathText = computed(() => pages.map((p) => p.path).join('  →  '))
        const drawerTitle = computed(() => (cur.value ? cur.value.name : '接口明细'))
        function open(a) {
          cur.value = a
          visible.value = true
        }
        return { pages, pageId, visible, cur, pathText, drawerTitle, open }
      }
    }).use(ElementPlus).mount('#app')
  </script>
</body>
</html>
