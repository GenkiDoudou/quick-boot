<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户行为 · A 故事时间线</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2/dist/index.css" />
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #fff;
      --line: #e4e7ed;
      --text: #303133;
      --muted: #909399;
      --primary: #409eff;
      --act: #e6a23c;
      --rail: #dcdfe6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
    .top {
      background: #fff; border-bottom: 1px solid var(--line);
      padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .top a { color: var(--primary); font-size: 13px; text-decoration: none; }
    .top h1 { font-size: 16px; margin: 0; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 48px; }
    .session {
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 12px 16px; margin-bottom: 20px; font-size: 13px; color: var(--muted);
    }
    .session b { color: var(--text); }
    .story { position: relative; padding-left: 28px; }
    .story::before {
      content: ""; position: absolute; left: 11px; top: 8px; bottom: 8px;
      width: 2px; background: var(--rail);
    }
    .block { position: relative; margin-bottom: 8px; }
    .dot {
      position: absolute; left: -28px; top: 14px; width: 14px; height: 14px;
      border-radius: 50%; border: 3px solid var(--primary); background: #fff; z-index: 1;
    }
    .dot.act { border-color: var(--act); }
    .dot.jump { border-color: #67c23a; background: #67c23a; width: 10px; height: 10px; left: -26px; top: 10px; }
    .page-card, .act-card, .jump-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 12px 14px;
    }
    .page-card { border-left: 4px solid var(--primary); }
    .act-card { border-left: 4px solid var(--act); margin-left: 12px; cursor: pointer; }
    .act-card:hover, .act-card.open { border-color: var(--act); box-shadow: 0 2px 8px rgba(230,162,60,.15); }
    .jump-card {
      border: 1px dashed #b3e19d; background: #f0f9eb; color: #67c23a;
      font-size: 12px; padding: 8px 12px; margin: 4px 0 12px 12px;
    }
    .kicker { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .title { font-size: 15px; font-weight: 700; }
    .path { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); margin-top: 2px; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .drill {
      margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line);
      display: none;
    }
    .act-card.open .drill { display: block; }
    .grp { margin-bottom: 10px; }
    .grp h4 { margin: 0 0 6px; font-size: 12px; color: var(--primary); }
    .span {
      background: #f5f7fa; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; font-size: 12px;
    }
    .span .n { font-family: ui-monospace, Consolas, monospace; word-break: break-all; }
    .sql {
      margin: 6px 0 0; padding: 8px; background: #1e1e1e; color: #d4d4d4;
      border-radius: 4px; font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow: auto;
    }
    .hint { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="top">
    <a href="./user-behavior-journey-picker.html">← 选型</a>
    <h1>A · 故事时间线</h1>
    <span style="font-size:12px;color:#909399">点击橙色「操作」卡片展开接口 / SQL</span>
  </div>
  <div id="app" class="wrap">
    <div class="session">
      会话 <b class="mono">{{ session.sessionId }}</b>
      · 用户 <b>{{ session.uin }}</b>
      · {{ session.startedAt }} ~ {{ session.endedAt }}
    </div>
    <p class="hint">阅读顺序：进入页面 →（可选）页内点击 → 跳转下一页。操作就地展开，不必跳走。</p>
    <div class="story">
      <template v-for="(item, idx) in story" :key="idx">
        <div v-if="item.type === 'page'" class="block">
          <div class="dot"></div>
          <div class="page-card">
            <div class="kicker">进入页面 · 第 {{ item.ord }} 站</div>
            <div class="title">{{ item.title }}</div>
            <div class="path">{{ item.pagePath }}</div>
            <div class="meta" v-if="item.fromPage">来自 {{ item.fromPage }} · {{ item.time }}</div>
            <div class="meta" v-else>{{ item.time }}</div>
          </div>
        </div>
        <div v-else-if="item.type === 'action'" class="block">
          <div class="dot act"></div>
          <div class="act-card" :class="{ open: openId === item.id }" @click="toggle(item.id)">
            <div class="kicker">在本页点击</div>
            <div class="title">「{{ item.actionName }}」</div>
            <div class="meta">{{ item.time }} · {{ openId === item.id ? '收起详情' : '展开：接口 / 方法 / SQL' }}</div>
            <div class="drill" @click.stop>
              <div class="grp">
                <h4>接口（{{ item.apis.length }}）</h4>
                <div v-for="(a, i) in item.apis" :key="'a'+i" class="span">
                  <div class="n">{{ a.name }}</div>
                  <div class="meta">{{ a.ms }}ms · HTTP {{ a.status }}</div>
                </div>
              </div>
              <div class="grp">
                <h4>SQL（{{ item.sqls.length }}）</h4>
                <div v-for="(s, i) in item.sqls" :key="'s'+i" class="span">
                  <div class="n">{{ s.mapper }}</div>
                  <div class="meta">{{ s.ms }}ms</div>
                  <pre class="sql">{{ s.sql }}</pre>
                </div>
              </div>
              <el-button type="primary" link size="small" @click="msg">打开完整请求链路</el-button>
            </div>
          </div>
        </div>
        <div v-else-if="item.type === 'jump'" class="block">
          <div class="dot jump"></div>
          <div class="jump-card">↓ 跳转 {{ item.from }} → {{ item.to }}</div>
        </div>
      </template>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2/dist/index.full.min.js"></script>
  <script>
    const { createApp, ref } = Vue
    createApp({
      setup() {
        const openId = ref('act-add')
        const session = {
          sessionId: 'sess_demo_8f2a',
          uin: 'admin',
          startedAt: '2026-08-15 16:40:01',
          endedAt: '2026-08-15 16:41:22'
        }
        const story = [
          {
            type: 'page', ord: 1, title: '工作台',
            pagePath: '/home', fromPage: '', time: '16:40:01'
          },
          {
            type: 'jump', from: '/home', to: '/system/user'
          },
          {
            type: 'page', ord: 2, title: '用户管理',
            pagePath: '/system/user', fromPage: '/home', time: '16:40:18'
          },
          {
            type: 'action', id: 'act-add', actionName: '新增', time: '16:40:25',
            apis: [
              { name: 'GET /system/user/deptTree', ms: 42, status: 200 },
              { name: 'GET /system/dict/data/type/sys_user_sex', ms: 18, status: 200 }
            ],
            sqls: [
              {
                mapper: 'SysDeptMapper.selectList',
                ms: 3,
                sql: 'SELECT dept_id, parent_id, dept_name FROM sys_dept WHERE del_flag = 0 ORDER BY order_num'
              }
            ]
          },
          {
            type: 'jump', from: '/system/user', to: '/system/user/form'
          },
          {
            type: 'page', ord: 3, title: '新建用户',
            pagePath: '/system/user/form', fromPage: '/system/user', time: '16:40:26'
          },
          {
            type: 'action', id: 'act-save', actionName: '保存', time: '16:41:05',
            apis: [
              { name: 'POST /system/user', ms: 86, status: 200 }
            ],
            sqls: [
              {
                mapper: 'SysUserMapper.insert',
                ms: 5,
                sql: "INSERT INTO sys_user (user_name, nick_name, ...) VALUES ('demo', ...)"
              },
              {
                mapper: 'SysUserRoleMapper.insertBatch',
                ms: 2,
                sql: 'INSERT INTO sys_user_role (user_id, role_id) VALUES (?, ?)'
              }
            ]
          }
        ]
        function toggle(id) {
          openId.value = openId.value === id ? '' : id
        }
        function msg() {
          ElementPlus.ElMessage.success('原型：将跳转请求链路（traceId）')
        }
        return { session, story, openId, toggle, msg }
      }
    }).use(ElementPlus).mount('#app')
  </script>
</body>
</html>
