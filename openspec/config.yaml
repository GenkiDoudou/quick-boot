schema: spec-driven

context: |
  所有 OpenSpec 产物（proposal/design/spec/tasks）正文统一使用简体中文。
  代码、命令、路径、配置键等专有标识保持英文原文。

  文件编码规范（强制）：
  - 新建或修改任何文本文件时，一律使用 UTF-8 编码（建议 UTF-8 无 BOM）。
  - 禁止使用 GBK/ANSI/UTF-16 等可能导致乱码的编码。
  - 若发现历史文件编码不一致，先统一为 UTF-8 再继续修改。

  在生成或修改前端页面/组件代码前，必须先读取仓库根目录 DESIGN.md 并严格遵循其设计规范。
  禁止将 DESIGN.md 正文复制到本文件中替代阅读。

  生成代码前必须读取并遵循：
  - openspec/project.md
  - sdd/后端代码规范.md
  - sdd/前端代码规范.md
  - sdd/数据库设计规范.md

  生成代码时必须落实 openspec/project.md 中的项目级约束（技术栈、目录分层、校验流程、协作规范）。

  与口头指令冲突时，优先以规范文档为准，并提示用户确认例外。
